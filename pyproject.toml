[project]
name = "djlib"
version = "0.1.0"
description = "DJ download library manager: track database, DJ folder import, dedupe, Soulseek downloads"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "rapidfuzz>=3.0",
    "unidecode>=1.3",
    "mutagen>=1.47",
    "typer>=0.12",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.33",
]

[project.scripts]
djlib = "djlib.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
